<!DOCTYPE html>
<meta charset="utf-8">
<title>e2e-cam</title>
<pre id="out">running</pre>
<script>
/* カメラで実際にバーコードを読めるかのテスト。
 *
 * 偽のカメラ映像として、生成した EAN-13 の y4m を流し込んで走らせる
 * （run.ps1 が --use-file-for-fake-video-capture で渡す）。
 * 本体のテスト（/e2e）とは別のブラウザ起動にしている。映像にバーコードが
 * 映っていると、カメラを開いた瞬間に読めてパネルが閉じてしまい、
 * 「開いて・映って・止められる」のテストが成立しないため。
 */
const results = [];
function check(label, cond, detail) {
  results.push((cond ? 'OK   ' : 'FAIL ') + label + (cond ? '' : '  << ' + detail));
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// テストが終わるまで load イベントを止めておく（実時間で走らせるため）
const hold = document.createElement('img');
hold.src = '/wait';
document.body.appendChild(hold);

['smk.url', 'smk.pass', 'smk.user', 'smk.cache'].forEach((k) => localStorage.removeItem(k));
localStorage.setItem('smk.users', JSON.stringify(['山田']));

function loadFrame(src) {
  return new Promise((resolve, reject) => {
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:900px;height:700px';
    fr.onload = () => {
      const doc = fr.contentDocument;
      if (doc && doc.getElementById('who')) resolve(fr);
    };
    setTimeout(() => reject(new Error('画面が開きませんでした: ' + src)), 10000);
    document.body.appendChild(fr);
    fr.src = src;
  });
}

(async function main() {
  try {
    const f = await loadFrame('/index.html');
    const d = f.contentDocument;
    await sleep(300);
    d.querySelector('#whoRecent .who-pick').click();
    await sleep(1200);

    d.getElementById('btnCamera').click();

    // 読めるまで最大15秒待つ
    let waited = 0;
    while (waited < 15000 && !d.getElementById('jan').value) {
      await sleep(250);
      waited += 250;
    }

    check('カメラでバーコードを読める（JANが入る）',
      d.getElementById('jan').value === '4901234567894',
      '"' + d.getElementById('jan').value + '" ' + waited + 'ms / ' +
      d.getElementById('camMsg').textContent);

    check('読めたらカメラを閉じてカメラを離す',
      d.getElementById('cameraPanel').classList.contains('hidden') &&
      !d.getElementById('video').srcObject,
      'panel=' + d.getElementById('cameraPanel').className);

    await sleep(1200);
    check('読んだらそのまま照会まで進む',
      !d.getElementById('entry').classList.contains('hidden') &&
      d.getElementById('name').value === 'テスト商品 500ml',
      'entry=' + d.getElementById('entry').className + ' name=' + d.getElementById('name').value);
  } catch (e) {
    results.push('FAIL 例外: ' + e.message + '\n' + e.stack);
  }

  const failed = results.filter((r) => r.startsWith('FAIL')).length;
  document.getElementById('out').textContent =
    results.join('\n') + '\n\n=== ' + (results.length - failed) + ' 件成功 / ' + failed + ' 件失敗 ===';
  hold.src = '';
  if (hold.parentNode) hold.parentNode.removeChild(hold);
})();
</script>
